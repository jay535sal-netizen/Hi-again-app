# ------------------------------------------------------------------
# Generate Release Keystore — Hi Again
#
# Runs ONCE. Creates the upload keystore used to sign every Play Store
# release of this app, then uploads it as an artifact you download to
# your password manager. After this, never run it again or you'll lose
# the ability to publish updates.
#
# Prerequisites:
#   - Repo secrets KEYSTORE_PASSWORD and KEY_PASSWORD must exist
#   - You created them at: Settings → Secrets and variables → Actions
# ------------------------------------------------------------------

name: Generate Release Keystore (ONE TIME ONLY)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "I UNDERSTAND" to confirm. Losing the keystore = cannot update the app, ever.'
        required: true
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'I UNDERSTAND' }}
    steps:
      - name: Verify required secrets are set
        env:
          STORE_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_PWD" ] || [ -z "$KEY_PWD" ]; then
            echo "::error::Set KEYSTORE_PASSWORD and KEY_PASSWORD repo secrets first."
            echo "Go to: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "Secrets present. Generating keystore..."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        env:
          STORE_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair -v \
            -keystore hi-again-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias hi-again \
            -storepass "$STORE_PWD" \
            -keypass "$KEY_PWD" \
            -dname "CN=Hi Again, O=Crowdspulse Gsphere LLC, L=Unknown, ST=Unknown, C=US"
          echo "✓ Keystore created."
          keytool -list -v \
            -keystore hi-again-release.jks \
            -storepass "$STORE_PWD" \
            -alias hi-again | head -20

      - name: Encode keystore to base64
        run: |
          base64 -w 0 hi-again-release.jks > keystore-base64.txt
          echo "✓ Base64-encoded ($(wc -c < keystore-base64.txt) chars)."

      - name: Write base64 to run summary
        run: |
          {
            echo "# 🔐 Your Keystore Base64"
            echo ""
            echo "Copy the entire block below — including no newlines — and paste it as a NEW repo secret named **KEYSTORE_BASE64**."
            echo ""
            echo '```'
            cat keystore-base64.txt
            echo ""
            echo '```'
            echo ""
            echo "## Next steps"
            echo ""
            echo "1. Go to **Settings → Secrets and variables → Actions → New repository secret**"
            echo "2. Name: \`KEYSTORE_BASE64\`"
            echo "3. Value: paste the base64 string above"
            echo "4. Click **Add secret**"
            echo "5. Also download the **hi-again-release-keystore** artifact (below) and save the \`.jks\` file in your password manager. NEVER lose it."
            echo "6. Add one more secret: \`GOOGLE_SERVICES_JSON\` — paste the full contents of \`frontend/android/app/google-services.json\` from your repo."
            echo "7. Once all 4 secrets are set (\`KEYSTORE_PASSWORD\`, \`KEY_PASSWORD\`, \`KEYSTORE_BASE64\`, \`GOOGLE_SERVICES_JSON\`), run the **Build Android AAB** workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore artifact (download & save to password manager)
        uses: actions/upload-artifact@v4
        with:
          name: hi-again-release-keystore
          path: hi-again-release.jks
          retention-days: 90
          if-no-files-found: error

      - name: Notice
        if: ${{ github.event.inputs.confirm != 'I UNDERSTAND' }}
        run: |
          echo "::error::You must type 'I UNDERSTAND' (without quotes) in the workflow input to run this."
          exit 1

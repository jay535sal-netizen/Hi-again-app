# ------------------------------------------------------------------
# Build Android AAB — Hi Again
#
# Builds a signed release Android App Bundle (AAB) ready for upload to
# Google Play Console. Runs in the cloud — no local Android SDK needed.
#
# Required repo secrets (set under Settings → Secrets and variables → Actions):
#   - KEYSTORE_BASE64      → from Generate Release Keystore workflow output
#   - KEYSTORE_PASSWORD    → store password you chose
#   - KEY_PASSWORD         → key password you chose
#   - GOOGLE_SERVICES_JSON → full contents of frontend/android/app/google-services.json
#
# Output:
#   - frontend/android/app/build/outputs/bundle/release/app-release.aab
#     (downloadable from the workflow Artifacts panel after the run)
# ------------------------------------------------------------------

name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        working-directory: .
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ]      && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ]    && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_PASSWORD" ]         && missing="$missing KEY_PASSWORD"
          [ -z "$GOOGLE_SERVICES_JSON" ] && missing="$missing GOOGLE_SERVICES_JSON"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing"
            echo "Set them at: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "✓ All secrets present."

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore google-services.json from secret
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GS_JSON" > android/app/google-services.json
          echo "✓ google-services.json restored ($(wc -c < android/app/google-services.json) bytes)"
          python3 -c "import json,sys; d=json.load(open('android/app/google-services.json')); pkg=d['client'][0]['client_info']['android_client_info']['package_name']; assert pkg=='com.crowdspulse.hiagain', f'Package name mismatch in google-services.json: {pkg}'; print('✓ package name correct:', pkg)"

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/hi-again-release.jks
          echo "✓ Keystore decoded ($(wc -c < android/app/hi-again-release.jks) bytes)"

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/app/keystore.properties << EOF
          storeFile=hi-again-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=hi-again
          keyPassword=$KEY_PASSWORD
          EOF
          echo "✓ keystore.properties written"

      - name: Patch build.gradle to use relative storeFile path
        run: |
          # The signing block in build.gradle uses `file(storeFile)` which
          # resolves relative to the module dir. Our keystore.properties says
          # `hi-again-release.jks` (relative) so this just works.
          ls -la android/app/hi-again-release.jks android/app/keystore.properties

      - name: Install yarn dependencies
        run: yarn install --frozen-lockfile

      - name: Build React app
        run: yarn build
        env:
          REACT_APP_BACKEND_URL: https://hiagain.xyz
          CI: 'false'  # treat ESLint warnings as warnings, not errors

      - name: Capacitor sync Android
        run: npx cap sync android

      - name: Build signed release AAB
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          # --no-daemon / --no-build-cache avoid a known Gradle 8.2 race that
          # corrupts the bcprov-jdk18on jar extraction in CI.
          ./gradlew bundleRelease --no-daemon --no-build-cache --no-configuration-cache --stacktrace

      - name: Show AAB info
        working-directory: frontend/android
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          ls -lh "$AAB"
          echo "::notice::AAB built: $(du -h $AAB | cut -f1)"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: hi-again-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Build success summary
        if: success()
        run: |
          {
            echo "# 🎉 AAB build succeeded"
            echo ""
            echo "Download the **hi-again-release-aab** artifact (below) and upload it to:"
            echo ""
            echo "https://play.google.com/console → Your app → **Testing → Closed testing → Create track**"
            echo ""
            echo "## Reminder"
            echo "- First Play submission review: 3-7 days"
            echo "- Closed Testing track: 24-48 hr (recommended for first release)"
            echo "- Have the Background Location justification ready (see \`GOOGLE_PLAY_LISTING.md\` § 7)"
          } >> "$GITHUB_STEP_SUMMARY"
